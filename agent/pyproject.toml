[project]
name = "a2ui-restaurant-finder"
version = "0.1.0"
description = "Sample Google ADK-based Restaurant finder agent exposed as an AG-UI HTTP endpoint."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-adk>=0.6.0",
    "a2ui-agent-sdk>=0.2.1",
    "click>=8.1.8",
    "fastapi>=0.115.0",
    "google-adk>=1.28.0",
    "google-genai>=1.27.0",
    "litellm",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
